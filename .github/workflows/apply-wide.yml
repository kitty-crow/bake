name: Apply wide lowering patch

on:
  push:
    branches: [agent/tarot-engine-wide]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tarot-engine-wide
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply and verify
        run: |
          set -Eeuo pipefail
          cat .apply-wide.00 .apply-wide.01 .apply-wide.02 | base64 -d | gzip -d > /tmp/wide.patch
          git apply --index /tmp/wide.patch
          rm .apply-wide.00 .apply-wide.01 .apply-wide.02 .github/workflows/apply-wide.yml
          git add -A
          npm install --package-lock=false
          npm test

      - name: Commit branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Expand wide lowering for application cores"
          git push origin HEAD:agent/tarot-engine-wide
